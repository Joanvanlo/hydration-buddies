<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Water Check-in 💧</title>
  <style>
    :root {
      --bg: #f5f3ff;
      --card-bg: #ffffff;
      --accent: #4c6fff;
      --accent-soft: #c7d2ff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.16);
      --border-dashed: rgba(148, 163, 184, 0.5);

      /* Vacation palette */
      --vac-bg: #f6e7c8;          /* sandy beige */
      --vac-text: #7a5a2a;        /* darker sand */
      --vac-muted: rgba(122,90,42,0.75);
      --vac-border: rgba(122,90,42,0.18);
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #e0f2fe, #f5f3ff 50%, #fee2e2);
      color: var(--text-main);
      position: relative;
      overflow-x: hidden;
    }

    .app {
      position: relative;
      background: var(--card-bg);
      border-radius: 26px;
      padding: 24px 26px 22px;
      width: 400px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(148, 163, 184, 0.18);
      z-index: 1;
    }

    .app-header { margin-bottom: 14px; }

    .title {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title-emoji { font-size: 22px; }

    .date {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .sound-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .sound-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .sound-toggle input { display: none; }

    .sound-toggle-pill {
      width: 32px;
      height: 16px;
      background: #e5e7eb;
      border-radius: 999px;
      position: relative;
      transition: background 0.15s ease;
    }

    .sound-toggle-knob {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #ffffff;
      position: absolute;
      top: 2px;
      left: 2px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.3);
      transition: transform 0.15s ease;
    }

    .sound-toggle input:checked + .sound-toggle-pill { background: #4c6fff; }
    .sound-toggle input:checked + .sound-toggle-pill .sound-toggle-knob { transform: translateX(14px); }
    .sound-toggle-label { user-select: none; }

    /* 2x2 tabs */
    .user-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 10px 0 16px;
    }

    .user-tab {
      width: 100%;
      padding: 6px 0;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      font-size: 12px;
      background: #f9fafb;
      color: #4b5563;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, color 0.15s ease,
        border-color 0.15s ease, transform 0.08s ease;
    }

    .user-tab span.emoji { font-size: 14px; }

    .user-tab.active {
      background: #4c6fff;
      color: white;
      border-color: #4c6fff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    /* Goal + Vacation (2 columns) */
    .goal-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 12px 0 16px;
      align-items: start;
    }

    .goal-box, .vac-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .goal-label, .vac-label {
      font-weight: 700;
      color: var(--text-main);
      font-size: 12px;
    }

    /* Goal stepper */
    .goal-stepper {
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      gap: 8px;
      align-items: center;
    }

    .step-btn {
      height: 36px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      background: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      color: #374151;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      transition: transform 0.08s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }

    .step-btn:active {
      transform: translateY(1px);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    .step-btn[disabled] {
      cursor: not-allowed;
      opacity: 0.55;
      background: #f3f4f6;
    }

    .goal-input {
      width: 100%;
      height: 36px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      padding: 8px 10px;
      font-size: 12px;
      outline: none;
      background: #fff;
      text-align: center;
      font-weight: 700;
      color: #111827;
    }

    /* Remove number input spinners (the little clicker) */
.goal-input::-webkit-outer-spin-button,
.goal-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.goal-input {
  appearance: textfield;      /* modern */
  -moz-appearance: textfield; /* Firefox */
}

    .goal-input:focus {
      border-color: #4c6fff;
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.3);
    }

    .goal-input[disabled] {
      background: #f3f4f6;
      color: #6b7280;
      cursor: not-allowed;
    }

    .goal-subline {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: -4px;
      text-align: center;
    }

    /* Vacation toggle */
    .vacation-toggle {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      padding-top: 2px;
    }

    .vacation-toggle input { display: none; }

    .vac-pill {
      width: 38px;
      height: 18px;
      border-radius: 999px;
      background: #e5e7eb;
      position: relative;
      transition: background 0.2s ease;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    .vac-knob {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #ffffff;
      position: absolute;
      top: 1px;
      left: 1px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25);
      transition: transform 0.2s ease;
    }

    .vac-text {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .vacation-toggle input:checked + .vac-pill {
      background: linear-gradient(135deg, #fcd34d, #fde68a);
      border-color: rgba(122,90,42,0.25);
    }

    .vacation-toggle input:checked + .vac-pill .vac-knob {
      transform: translateX(20px);
    }

    .vacation-toggle input:checked ~ .vac-text {
      color: var(--vac-text);
    }

    .vac-help {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: -2px;
    }

    .glasses-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 6px 0 18px;
    }

    .glass-btn {
      border: none;
      background: #f3f4ff;
      border-radius: 999px;
      padding: 4px 0 3px;
      cursor: pointer;
      font-size: 19px;
      transition: transform 0.1s ease-out, box-shadow 0.1s ease-out,
        background 0.15s ease-out;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
    }

    .glass-btn.filled {
      background: #dbeafe;
      box-shadow: 0 3px 8px rgba(37, 99, 235, 0.25);
    }

    .glass-btn.pop { animation: glassPop 0.25s ease-out; }

    @keyframes glassPop {
      0% { transform: translateY(3px) scale(0.9); }
      60% { transform: translateY(-2px) scale(1.12); }
      100% { transform: translateY(0) scale(1); }
    }

    .office-note {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
    }

    .pill {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #ecfeff;
      color: #0369a1;
      border: 1px solid #bae6fd;
    }

    .time-left {
      margin-top: 6px;
      margin-bottom: 16px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .meters-card {
      margin-top: 18px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-dashed);
      font-size: 12px;
    }

    .meters-title {
      font-weight: 600;
      margin-bottom: 10px;
    }

    .person-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 10px 12px;
      margin-bottom: 12px;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.18);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    /* Vacation styling */
    .person-card.vacation {
      background: var(--vac-bg);
      border-color: var(--vac-border);
    }
    .person-card.vacation .meter-name,
    .person-card.vacation .streak-number {
      color: var(--vac-text);
    }
    .person-card.vacation .meter-text,
    .person-card.vacation .meter-message,
    .person-card.vacation .streak-label {
      color: var(--vac-muted);
    }
    .person-card.vacation .person-right {
      border-left-color: rgba(122,90,42,0.28);
    }

    .person-inner { display: flex; align-items: stretch; gap: 10px; }

    .person-left {
      flex: 2;
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .person-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-left: 10px;
      border-left: 1px dashed var(--border-dashed);
    }

    .person-toprow {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
    }

    .meter-name {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      color: var(--text-main);
    }

    .meter-name span.emoji { font-size: 16px; }

    .meter-bar {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
      position: relative;
    }

    .meter-inner {
      height: 100%;
      background: linear-gradient(90deg, #a5b4fc, #4c6fff);
      width: 0%;
      transition: width 0.25s ease-out, background 0.2s ease-out;
    }

    .meter-text {
      margin-top: 3px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .meter-message {
      margin-top: 1px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .streak-main {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }

    .streak-number {
      font-size: 18px;
      line-height: 1.1;
      color: var(--text-main);
      font-weight: 800;
    }

    .streak-fire { font-size: 16px; line-height: 1.1; }

    .streak-label {
      font-size: 10px;
      text-transform: lowercase;
      color: var(--text-muted);
    }

    .confetti-piece {
      position: fixed;
      font-size: 18px;
      animation: confettiFall 1.2s ease-out forwards;
      pointer-events: none;
      z-index: 9999;
    }

    @keyframes confettiFall {
      0% { opacity: 1; transform: translateY(0) rotate(0deg); }
      100% { opacity: 0; transform: translateY(260px) rotate(30deg); }
    }

    .glass-drop {
      position: absolute;
      font-size: 18px;
      pointer-events: none;
      animation: dropIntoGlass 0.38s ease-out forwards;
      z-index: 5;
    }

    @keyframes dropIntoGlass {
      0% { transform: translateY(-14px); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(6px); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="title">
        <span class="title-emoji">💧</span>
        <span>Water check-in</span>
      </div>
      <div class="date" id="date"></div>
    </header>

    <p class="sub">Pick who you’re logging for, then tap to update.</p>

    <div class="sound-row">
      <label class="sound-toggle">
        <input type="checkbox" id="sound-toggle-input" />
        <span class="sound-toggle-pill">
          <span class="sound-toggle-knob"></span>
        </span>
        <span class="sound-toggle-label">Sound effects</span>
      </label>
    </div>

    <div class="user-tabs" id="user-tabs"></div>

    <!-- ✅ Updated: Daily goal stepper + Vacation toggle -->
    <div class="goal-row">
      <div class="goal-box">
        <div class="goal-label" id="goal-label">Daily goal</div>
        <div class="goal-stepper">
          <button class="step-btn" id="goal-minus" type="button" aria-label="Decrease goal">−</button>
          <input id="goal-input" class="goal-input" type="number" min="1" max="15" />
          <button class="step-btn" id="goal-plus" type="button" aria-label="Increase goal">+</button>
        </div>
        <div class="goal-subline" id="goal-unit">glasses</div>
      </div>

      <div class="vac-box">
        <div class="vac-label">Vacation mode:</div>
        <label class="vacation-toggle">
          <input type="checkbox" id="vacation-toggle" />
          <span class="vac-pill">
            <span class="vac-knob"></span>
          </span>
          <span class="vac-text" id="vacation-text">Working</span>
        </label>
        <div class="vac-help" id="vac-help">Freezes streak while on 🏝️</div>
      </div>
    </div>

    <div class="glasses-row" id="glasses-row"></div>

    <div class="office-note">
      <span>Office hours: 09:00–17:30</span>
      <span class="pill" id="status-pill">Today</span>
    </div>
    <div class="time-left" id="time-left"></div>

    <div class="meters-card">
      <div class="meters-title">Water meter 💧</div>
      <div id="meters-list"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      setDoc,
      collection,
      query,
      onSnapshot,
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAh3Wqa8NSzdWIXRNBJ6TqYHgNm8y7faI",
      authDomain: "hydration-buddies-5fa86.firebaseapp.com",
      projectId: "hydration-buddies-5fa86",
      storageBucket: "hydration-buddies-5fa86.appspot.com",
      messagingSenderId: "23662841356",
      appId: "1:23662841356:web:41c2195ab1acb139439329",
      measurementId: "G-FVEE8GDG13"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const GROUP_ID = "hydration-besties";

    const USERS = [
      { id: "joan",  name: "Joan",  emoji: "🧝‍♀️", cadence: "daily",  defaultGoal: 8 },
      { id: "loes",  name: "Loes",  emoji: "🐱",   cadence: "daily",  defaultGoal: 8 },
      { id: "john",  name: "John",  emoji: "💪",   cadence: "daily",  defaultGoal: 8 },
      { id: "plant", name: "Perry", emoji: "🌿",   cadence: "weekly", defaultGoal: 1 },
    ];

    const MAX_GLASSES = 15;
    const OFFICE_START_H = 9;
    const OFFICE_START_M = 0;
    const OFFICE_END_H = 17;
    const OFFICE_END_M = 30;

    const STORAGE_PREFIX = "waterTracker_v13_";

    const now = new Date();
    const todayKey = now.toISOString().slice(0, 10);

    const dateEl = document.getElementById("date");
    const userTabsEl = document.getElementById("user-tabs");
    const goalInputEl = document.getElementById("goal-input");
    const goalLabelEl = document.getElementById("goal-label");
    const goalUnitEl  = document.getElementById("goal-unit");
    const goalMinusBtn = document.getElementById("goal-minus");
    const goalPlusBtn  = document.getElementById("goal-plus");
    const vacationToggleEl = document.getElementById("vacation-toggle");
    const vacationTextEl = document.getElementById("vacation-text");
    const vacHelpEl = document.getElementById("vac-help");

    const glassesRowEl = document.getElementById("glasses-row");
    const statusPill = document.getElementById("status-pill");
    const timeLeftEl = document.getElementById("time-left");
    const metersListEl = document.getElementById("meters-list");
    const soundToggleInput = document.getElementById("sound-toggle-input");
    const appEl = document.querySelector(".app");

    function clamp(val, min, max) {
      return Math.min(max, Math.max(min, val));
    }

    function formatDatePretty(d) {
      return d.toLocaleDateString(undefined, {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric",
      });
    }

    function toDateKey(d) {
      return d.toISOString().slice(0, 10);
    }

    function isWeekendKey(dateKey) {
      const d = new Date(dateKey + "T00:00:00");
      const day = d.getDay();
      return day === 0 || day === 6;
    }

    function toWeekKey(d) {
      const date = new Date(d);
      date.setHours(0, 0, 0, 0);
      date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7));
      const weekYear = date.getFullYear();

      const week1 = new Date(weekYear, 0, 4);
      const week1Day = (week1.getDay() + 6) % 7;
      week1.setDate(week1.getDate() - week1Day);

      const diffDays = Math.round((date - week1) / 86400000);
      const week = 1 + Math.floor(diffDays / 7);
      return `${weekYear}-W${String(week).padStart(2, "0")}`;
    }

    function weekKeyOffset(offsetWeeks) {
      const d = new Date();
      d.setDate(d.getDate() + offsetWeeks * 7);
      return toWeekKey(d);
    }

    function getUser(userId) {
      return USERS.find(u => u.id === userId) || USERS[0];
    }

    function getPeriodKeyForUser(user, d = new Date()) {
      return user.cadence === "weekly" ? toWeekKey(d) : toDateKey(d);
    }

    function storageKeyCount(userId, periodKey) {
      return `${STORAGE_PREFIX}count_${periodKey}_${userId}`;
    }
    function storageKeyGoal(userId) {
      return `${STORAGE_PREFIX}goal_${userId}`;
    }
    function storageKeySelectedUser() {
      return `${STORAGE_PREFIX}selectedUser`;
    }
    function storageKeySounds() {
      return `${STORAGE_PREFIX}sounds`;
    }

    // Daily reset for daily users only (weekly stays)
    const LAST_DATE_STORAGE_KEY = STORAGE_PREFIX + "lastDateKey";
    const lastDate = localStorage.getItem(LAST_DATE_STORAGE_KEY);
    if (lastDate && lastDate !== todayKey) {
      Object.keys(localStorage).forEach((k) => {
        if (k.startsWith(STORAGE_PREFIX + "count_") && !k.includes("-W")) {
          localStorage.removeItem(k);
        }
      });
    }
    localStorage.setItem(LAST_DATE_STORAGE_KEY, todayKey);

    function getEncouragement(count, goal, user) {
      if (user.cadence === "weekly") {
        return count >= goal ? "Plant is thriving 🌿✨" : "Water me once this week pls 🙏";
      }
      if (count <= 0) return "Let’s get that first glass 👀";
      if (count < goal / 2) return "Nice start, keep sipping 💧";
      if (count < goal) return "So close to your goal!";
      return "Goal reached, hydration hero 💪";
    }

    // Sounds
    let soundsEnabled = localStorage.getItem(storageKeySounds()) !== "off";
    soundToggleInput.checked = soundsEnabled;
    soundToggleInput.addEventListener("change", () => {
      soundsEnabled = soundToggleInput.checked;
      localStorage.setItem(storageKeySounds(), soundsEnabled ? "on" : "off");
    });

    function playClickSound() {
      if (!soundsEnabled) return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 900;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const t = ctx.currentTime;
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
      osc.start(t);
      osc.stop(t + 0.13);
    }

    function playGoalSound() {
      if (!soundsEnabled) return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = 600;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const t = ctx.currentTime;
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.start(t);
      osc.stop(t + 0.25);
    }

    function launchConfetti() {
      for (let i = 0; i < 40; i++) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.textContent = Math.random() < 0.5 ? "💧" : "🎉";
        piece.style.left = (Math.random() * 100) + "vw";
        piece.style.top = (5 + Math.random() * 20) + "vh";
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 1200);
      }
    }

    // State
    let selectedUserId = localStorage.getItem(storageKeySelectedUser()) || USERS[0].id;

    const counts = {};
    const goals = {};
    const history = {};
    const lastSuccess = {};

    // Work status profiles (synced via Firestore)
    // { [userId]: { status: "working"|"vacation", frozen_streak?: number, frozen_at?: string } }
    const profiles = {};
    function isVacationing(userId) {
      return profiles[userId]?.status === "vacation";
    }

    for (const u of USERS) {
      history[u.id] = {};
      const periodKey = getPeriodKeyForUser(u, now);

      const rawCount = Number(localStorage.getItem(storageKeyCount(u.id, periodKey)));
      counts[u.id] = Number.isFinite(rawCount) && rawCount >= 0 ? rawCount : 0;

      const rawGoal = Number(localStorage.getItem(storageKeyGoal(u.id)));
      let goal = (Number.isFinite(rawGoal) && rawGoal >= 1 && rawGoal <= MAX_GLASSES)
        ? rawGoal
        : (u.defaultGoal ?? 8);

      if (u.cadence === "weekly") goal = 1;
      goals[u.id] = goal;

      lastSuccess[u.id] = counts[u.id] >= goals[u.id];

      profiles[u.id] = profiles[u.id] || { status: "working" };
    }

    function didMeetGoalFromObj(dayObj) {
      if (!dayObj) return false;
      if (dayObj.goal_met === true) return true;
      const goal = dayObj.goal || 0;
      const count = dayObj.glasses_count || 0;
      return goal > 0 && count >= goal;
    }

    // Helper: compute streak normally (skips leading not-met)
    function computeStreakBase(userId) {
      const user = getUser(userId);
      const entries = history[userId] || {};

      if (user.cadence === "weekly") {
        const weekKeys = Object.keys(entries)
          .filter(k => /^\d{4}-W\d{2}$/.test(k))
          .sort((a, b) => b.localeCompare(a));

        let streak = 0;
        let started = false;

        for (const k of weekKeys) {
          const met = didMeetGoalFromObj(entries[k]);
          if (!started) {
            if (!met) continue;
            started = true;
            streak = 1;
            continue;
          }
          if (met) streak++;
          else break;
        }
        return streak;
      }

      const dayKeys = Object.keys(entries)
        .filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k))
        .filter(k => !isWeekendKey(k))
        .sort((a, b) => b.localeCompare(a));

      let streak = 0;
      let started = false;

      for (const k of dayKeys) {
        const met = didMeetGoalFromObj(entries[k]);
        if (!started) {
          if (!met) continue;
          started = true;
          streak = 1;
          continue;
        }
        if (met) streak++;
        else break;
      }
      return streak;
    }

    function computeStreak(userId) {
      if (isVacationing(userId)) {
        const frozen = profiles[userId]?.frozen_streak;
        return Number.isFinite(frozen) ? frozen : computeStreakBase(userId);
      }
      return computeStreakBase(userId);
    }

    function updateStatusAndTimeLeft() {
      const selected = getUser(selectedUserId);

      if (selected.cadence === "weekly") {
        statusPill.textContent = "Weekly mode";
        statusPill.style.background = "#ecfdf5";
        statusPill.style.color = "#065f46";
        statusPill.style.borderColor = "#a7f3d0";
        timeLeftEl.textContent = "Plant goal resets each week 🌿";
        return;
      }

      const now2 = new Date();
      const minutes = now2.getHours() * 60 + now2.getMinutes();
      const startMinutes = OFFICE_START_H * 60 + OFFICE_START_M;
      const endMinutes = OFFICE_END_H * 60 + OFFICE_END_M;

      if (minutes >= startMinutes && minutes < endMinutes) {
        statusPill.textContent = "In office hours";
        statusPill.style.background = "#ecfeff";
        statusPill.style.color = "#0369a1";
        statusPill.style.borderColor = "#bae6fd";

        const remaining = endMinutes - minutes;
        const h = Math.floor(remaining / 60);
        const m = remaining % 60;
        const labelHours = h > 0 ? `${h}h` : "";
        const labelMinutes = m > 0 ? `${m}m` : h === 0 ? "0m" : "";
        const name = getUser(selectedUserId).name;
        timeLeftEl.textContent = `${labelHours}${labelHours && labelMinutes ? " " : ""}${labelMinutes} left to reach ${name}'s goal today`;
      } else {
        statusPill.textContent = "Outside office hours";
        statusPill.style.background = "#fef3c7";
        statusPill.style.color = "#92400e";
        statusPill.style.borderColor = "#fed7aa";
        timeLeftEl.textContent = "Goal time is over for today. New streak starts tomorrow ✨";
      }
    }

    function renderUserTabs() {
      userTabsEl.innerHTML = "";
      for (const u of USERS) {
        const btn = document.createElement("button");
        btn.className = "user-tab" + (u.id === selectedUserId ? " active" : "");
        const emoji = isVacationing(u.id) ? "🏝️" : u.emoji;
        btn.innerHTML = `<span class="emoji">${emoji}</span><span>${u.name}</span>`;
        btn.addEventListener("click", () => {
          if (selectedUserId !== u.id) {
            selectedUserId = u.id;
            localStorage.setItem(storageKeySelectedUser(), selectedUserId);
            updateView();
          }
        });
        userTabsEl.appendChild(btn);
      }
    }

    function renderGlasses() {
      const user = getUser(selectedUserId);
      const periodKey = getPeriodKeyForUser(user, new Date());
      const count = counts[selectedUserId] || 0;

      const max = user.cadence === "weekly" ? 1 : MAX_GLASSES;

      const onVacation = isVacationing(selectedUserId);
      const emptyIcon = user.cadence === "weekly" ? "🪴" : (onVacation ? "🍹" : "🥛");
      const fullIcon  = "💧";

      glassesRowEl.innerHTML = "";
      for (let i = 1; i <= max; i++) {
        const btn = document.createElement("button");
        btn.className = "glass-btn";

        btn.textContent = i <= count ? fullIcon : emptyIcon;
        if (i <= count) btn.classList.add("filled");

        btn.addEventListener("click", () => {
          const current = counts[selectedUserId] || 0;

          if (i === current) {
            const next = clamp(current - 1, 0, max);
            counts[selectedUserId] = next;
            localStorage.setItem(storageKeyCount(selectedUserId, periodKey), String(next));
            playClickSound();
            updateView();
            saveToCloud(selectedUserId).catch(console.error);
            return;
          }

          const next = i;

          const rect = btn.getBoundingClientRect();
          const appRect = appEl.getBoundingClientRect();

          const drop = document.createElement("span");
          drop.className = "glass-drop";
          drop.textContent = "💧";
          drop.style.left = (rect.left - appRect.left + rect.width / 2 - 9) + "px";
          drop.style.top  = (rect.top - appRect.top - 6) + "px";
          appEl.appendChild(drop);
          setTimeout(() => drop.remove(), 400);

          setTimeout(() => {
            counts[selectedUserId] = next;
            localStorage.setItem(storageKeyCount(selectedUserId, periodKey), String(next));
            playClickSound();
            updateView();

            const newBtn = glassesRowEl.children[i - 1];
            if (newBtn) {
              newBtn.classList.add("pop");
              setTimeout(() => newBtn.classList.remove("pop"), 250);
            }

            saveToCloud(selectedUserId).catch(console.error);
          }, 150);
        });

        glassesRowEl.appendChild(btn);
      }
    }

    function renderMeters() {
      metersListEl.innerHTML = "";
      for (const u of USERS) {
        const count = counts[u.id] || 0;
        const goal  = goals[u.id] || (u.cadence === "weekly" ? 1 : 8);
        const ratio = goal > 0 ? count / goal : 0;
        const pct   = clamp(ratio * 100, 0, 100);
        const success = goal > 0 && count >= goal;

        const streak = computeStreak(u.id);

        const card = document.createElement("div");
        card.className = "person-card" + (isVacationing(u.id) ? " vacation" : "");

        const streakLabel = u.cadence === "weekly" ? "week streak" : "workday streak";
        card.title = `${u.name}: ${count}/${goal} · ${streak}-${streakLabel}`;

        const inner = document.createElement("div");
        inner.className = "person-inner";

        const left = document.createElement("div");
        left.className = "person-left";

        const topRow = document.createElement("div");
        topRow.className = "person-toprow";

        const nameEl = document.createElement("div");
        nameEl.className = "meter-name";

        const emoji = isVacationing(u.id) ? "🏝️" : u.emoji;
        nameEl.innerHTML = `<span class="emoji">${emoji}</span><span>${u.name}</span>`;
        topRow.appendChild(nameEl);

        const bar = document.createElement("div");
        bar.className = "meter-bar";
        const innerBar = document.createElement("div");
        innerBar.className = "meter-inner";
        innerBar.style.width = pct + "%";
        innerBar.style.background = success
          ? "linear-gradient(90deg,#22c55e,#16a34a)"
          : "linear-gradient(90deg,#a5b4fc,#4c6fff)";
        bar.appendChild(innerBar);

        const text = document.createElement("div");
        text.className = "meter-text";
        const unit = u.cadence === "weekly" ? "this week" : "today";
        text.textContent = `${count}/${goal} · ${unit}`;

        const msg = document.createElement("div");
        msg.className = "meter-message";
        msg.textContent = isVacationing(u.id)
          ? "Vacation mode: streak frozen 😎"
          : getEncouragement(count, goal, u);

        left.appendChild(topRow);
        left.appendChild(bar);
        left.appendChild(text);
        left.appendChild(msg);

        const right = document.createElement("div");
        right.className = "person-right";

        const streakMain = document.createElement("div");
        streakMain.className = "streak-main";

        const num = document.createElement("div");
        num.className = "streak-number";
        num.textContent = streak;

        const fire = document.createElement("div");
        fire.className = "streak-fire";
        fire.textContent = "🔥";

        streakMain.appendChild(num);
        streakMain.appendChild(fire);

        const label = document.createElement("div");
        label.className = "streak-label";
        label.textContent = streakLabel;

        right.appendChild(streakMain);
        right.appendChild(label);

        inner.appendChild(left);
        inner.appendChild(right);
        card.appendChild(inner);

        metersListEl.appendChild(card);
      }
    }

    function checkGoalCelebration() {
      const user = getUser(selectedUserId);
      const count = counts[user.id] || 0;
      const goal = goals[user.id] || (user.cadence === "weekly" ? 1 : 8);
      const success = goal > 0 && count >= goal;

      if (!lastSuccess[user.id] && success) {
        launchConfetti();
        playGoalSound();
      }
      lastSuccess[user.id] = success;
    }

    function setVacationUI(userId) {
      const on = isVacationing(userId);
      vacationToggleEl.checked = on;
      vacationTextEl.textContent = on ? "Vacation" : "Working";
      vacHelpEl.textContent = on ? "Streak is frozen 🏝️" : "Freezes streak while on 🏝️";
    }

    function updateGoalUI() {
      const user = getUser(selectedUserId);

      if (user.cadence === "weekly") {
        goalLabelEl.textContent = "Weekly goal:";
        goalUnitEl.textContent = "time";
        goalInputEl.value = "1";
        goalInputEl.disabled = true;
        goalMinusBtn.disabled = true;
        goalPlusBtn.disabled = true;

        vacationToggleEl.disabled = true;
        vacationToggleEl.checked = false;
        vacationTextEl.textContent = "Working";
        vacHelpEl.textContent = "Plant doesn’t take vacations 🌿";
        return;
      }

      goalLabelEl.textContent = "Daily goal:";
      goalUnitEl.textContent = "glasses";
      goalInputEl.disabled = false;

      goalInputEl.value = goals[selectedUserId] || 8;

      goalMinusBtn.disabled = false;
      goalPlusBtn.disabled = false;

      vacationToggleEl.disabled = false;
      setVacationUI(selectedUserId);
    }

    function updateView() {
      updateGoalUI();
      renderGlasses();
      renderMeters();
      checkGoalCelebration();
      updateStatusAndTimeLeft();
      renderUserTabs();
    }

    async function saveToCloud(userId) {
      const user = getUser(userId);
      const periodKey = getPeriodKeyForUser(user, new Date());

      const max = user.cadence === "weekly" ? 1 : MAX_GLASSES;
      const count = clamp(counts[userId] || 0, 0, max);

      const goal = user.cadence === "weekly" ? 1 : (goals[userId] || 8);
      const goalMet = goal > 0 && count >= goal;

      const id = `${periodKey}_${userId}`;
      const ref = doc(db, "groups", GROUP_ID, "entries", id);

      await setDoc(ref, {
        groupId: GROUP_ID,
        period: user.cadence,
        period_key: periodKey,
        date: todayKey,
        user_id: userId,
        name: user.name,
        glasses_count: count,
        goal,
        goal_met: goalMet,
        updated_at: new Date().toISOString(),
      }, { merge: true });
    }

    async function saveProfile(userId) {
      const p = profiles[userId] || { status: "working" };
      const ref = doc(db, "groups", GROUP_ID, "profiles", userId);
      await setDoc(ref, {
        user_id: userId,
        status: p.status || "working",
        frozen_streak: p.frozen_streak ?? null,
        frozen_at: p.frozen_at ?? null,
        updated_at: new Date().toISOString(),
      }, { merge: true });
    }

    function startProfilesListener() {
      const profilesCol = collection(db, "groups", GROUP_ID, "profiles");
      const qAll = query(profilesCol);

      onSnapshot(qAll, (snapshot) => {
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const userId = data.user_id || docSnap.id;
          if (!userId) return;

          profiles[userId] = profiles[userId] || { status: "working" };
          if (typeof data.status === "string") profiles[userId].status = data.status;
          if (typeof data.frozen_streak === "number") profiles[userId].frozen_streak = data.frozen_streak;
          if (typeof data.frozen_at === "string") profiles[userId].frozen_at = data.frozen_at;

          if (data.frozen_streak === null || data.frozen_streak === undefined) {
            delete profiles[userId].frozen_streak;
          }
          if (data.frozen_at === null || data.frozen_at === undefined) {
            delete profiles[userId].frozen_at;
          }
        });

        updateView();
      });
    }

    function startEntriesListener() {
      const entriesCol = collection(db, "groups", GROUP_ID, "entries");
      const qAll = query(entriesCol);

      onSnapshot(qAll, (snapshot) => {
        for (const u of USERS) history[u.id] = history[u.id] || {};

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const userId = data.user_id;
          if (!userId) return;

          const user = USERS.find(u => u.id === userId);
          if (!user) return;

          const key = data.period_key || data.date;
          if (!key) return;

          const day = history[userId][key] || {};

          if (typeof data.glasses_count === "number") {
            const max = user.cadence === "weekly" ? 1 : MAX_GLASSES;
            day.glasses_count = clamp(data.glasses_count, 0, max);
          }
          if (typeof data.goal === "number") {
            day.goal = user.cadence === "weekly" ? 1 : clamp(data.goal, 1, MAX_GLASSES);
          }
          if (typeof data.goal_met === "boolean") {
            day.goal_met = data.goal_met;
          }

          history[userId][key] = day;

          const currentKey = getPeriodKeyForUser(user, new Date());
          if (key === currentKey) {
            if (typeof day.glasses_count === "number") {
              counts[userId] = day.glasses_count;
              localStorage.setItem(storageKeyCount(userId, currentKey), String(day.glasses_count));
            }
            if (typeof day.goal === "number" && user.cadence !== "weekly") {
              goals[userId] = day.goal;
              localStorage.setItem(storageKeyGoal(userId), String(day.goal));
            }
          }
        });

        updateView();
      });
    }

    // Goal stepper buttons
    goalMinusBtn.addEventListener("click", () => {
      const user = getUser(selectedUserId);
      if (user.cadence === "weekly") return;

      const current = goals[selectedUserId] || 8;
      const next = clamp(current - 1, 1, MAX_GLASSES);
      goals[selectedUserId] = next;
      localStorage.setItem(storageKeyGoal(selectedUserId), String(next));
      playClickSound();
      updateView();
      saveToCloud(selectedUserId).catch(console.error);
    });

    goalPlusBtn.addEventListener("click", () => {
      const user = getUser(selectedUserId);
      if (user.cadence === "weekly") return;

      const current = goals[selectedUserId] || 8;
      const next = clamp(current + 1, 1, MAX_GLASSES);
      goals[selectedUserId] = next;
      localStorage.setItem(storageKeyGoal(selectedUserId), String(next));
      playClickSound();
      updateView();
      saveToCloud(selectedUserId).catch(console.error);
    });

    // Still allow manual typing in the number field
    goalInputEl.addEventListener("change", () => {
      const user = getUser(selectedUserId);
      if (user.cadence === "weekly") return;

      let val = Number(goalInputEl.value);
      if (!Number.isFinite(val)) val = goals[selectedUserId] || 8;
      val = clamp(val, 1, MAX_GLASSES);

      goals[selectedUserId] = val;
      localStorage.setItem(storageKeyGoal(selectedUserId), String(val));
      updateView();
      saveToCloud(selectedUserId).catch(console.error);
    });

    // Vacation toggle (replaces dropdown)
    vacationToggleEl.addEventListener("change", () => {
      const user = getUser(selectedUserId);
      if (user.cadence === "weekly") return;

      const wantsVacation = !!vacationToggleEl.checked;
      profiles[selectedUserId] = profiles[selectedUserId] || { status: "working" };

      if (wantsVacation) {
        const frozen = computeStreakBase(selectedUserId);
        profiles[selectedUserId].status = "vacation";
        profiles[selectedUserId].frozen_streak = frozen;
        profiles[selectedUserId].frozen_at = todayKey;
      } else {
        profiles[selectedUserId].status = "working";
        delete profiles[selectedUserId].frozen_streak;
        delete profiles[selectedUserId].frozen_at;
      }

      saveProfile(selectedUserId).catch(console.error);
      updateView();
    });

    // Init
    dateEl.textContent = formatDatePretty(now);
    updateView();
    setInterval(updateStatusAndTimeLeft, 60 * 1000);

    startProfilesListener();
    startEntriesListener();
  </script>
</body>
</html>
